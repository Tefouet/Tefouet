# .github/workflows/github-stats.yml

name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v1
        with:
          username: fredtefouet
          output: profile/stats.svg

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v1
        with:
          username: fredtefouet
          card: top-langs
          output: profile/top-langs.svg

      - name: Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update GitHub stats"
